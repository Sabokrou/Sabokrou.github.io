#animal-cnn .cnn-matrix td {padding:0;text-align:center}

#animal-cnn .cnn-math {display:grid;align-content:start;gap:.46rem;margin-block:.8rem}

#animal-cnn .cnn-math .cnn-values {font-variant-numeric:tabular-nums}
#animal-cnn details {margin-top:.6rem}

#animal-cnn details[open] > :not(summary) {margin-top:.45rem}
#animal-cnn .cnn-bars {display:grid;gap:.65rem;width:min(100%,31rem);margin-block:.8rem}
#animal-cnn .cnn-bar-label {display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.2rem}
#animal-cnn .cnn-bars .cnn-dog-mark {background:var(--viz-series-2)}
#animal-cnn .cnn-bars .cnn-cat-mark {background:var(--viz-series-3)}
#animal-cnn .cnn-outcome {margin-block:.7rem;font-weight:500}
#animal-cnn .cnn-nav {display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.65rem}
#animal-cnn .cnn-comparison,#animal-cnn .cnn-params {width:min(100%,40rem)}

#animal-cnn .cnn-facts {margin-top:.65rem}

 @keyframes cnn-send {0%{opacity:0;transform:translateX(-.62rem)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(.62rem)}}
}
@container (max-width:430px) {

}

<script>
(() => {
  const root = document.getElementById('animal-cnn');
  const examples = JSON.parse(document.getElementById('cnn-example-data').textContent);
  const element = (id) => root.querySelector('#cnn-' + id);
  const stageSelect = element('stage');
  const kernelCells = [[0,0], [0,1], [1,0], [1,1]];
  const learningRate = 0.1;
  const steps = [
    ['Input image', 'Input', 'What does the CNN see?'],
    ['Convolution', 'Forward pass', 'Slide one filter across the image'],
    ['ReLU and pooling', 'Forward pass', 'Turn nine responses into one feature'],
    ['Class prediction', 'Forward pass', 'Predict dog or cat'],
    ['Cross-entropy loss', 'Loss', 'How much probability went to the correct class?'],
    ['Classifier gradients', 'Backward pass', 'Send the loss back through the classifier'],
    ['Filter gradients', 'Backward pass', 'Add up every use of the same filter weight'],
    ['Weight update', 'Gradient descent', 'Update all seven parameters together'],
    ['New prediction', 'Forward pass after the update', 'Run the same image through the updated CNN']
  ];
  const captions = [
    'The network receives a 4 × 4 grid. Select a numbered cell to see which part of the drawing produced it.',
    'The same four weights are used at all nine positions. Select an output cell to inspect its input patch.',
    'ReLU keeps positive responses. Global average pooling takes the mean of all nine cells, including the zeros.',
    'The classifier converts the pooled feature into a score, then turns that score into two class probabilities.',
    'Cross-entropy takes the negative natural logarithm of the probability assigned to the training label.',
    'Follow the derivative from the output score to the classifier parameters and the pooled feature.',
    'Each active position sends a gradient back. Select a filter weight to see its contributions from all nine positions.',
    'Gradient descent subtracts the learning rate times the gradient from each parameter.',
    'The input and its label are the same. The new prediction uses the updated filter, classifier, and biases.'
  ];
  const sig = (score) => score >= 0 ? 1 / (1 + Math.exp(-score)) : Math.exp(score) / (1 + Math.exp(score));
  const softplus = (x) => Math.max(x, 0) + Math.log1p(Math.exp(-Math.abs(x)));
  const grid = (n, fn) => Array.from({length:n}, (_, i) => Array.from({length:n}, (_, j) => fn(i, j)));
  const sum = (numbers) => numbers.reduce((a, b) => a + b, 0);
  const total = (matrix) => sum(matrix.flat());
  const newModel = () => ({k:[[1,0],[0,-1]], b:0.25, v:1, c:-0.5});
  function forward(x, y, model) {
    const z = grid(3, (i, j) => model.b + sum(kernelCells.map(([u, v]) => model.k[u][v] * x[i+u][j+v])));
    const a = z.map(row => row.map(value => Math.max(0, value)));
    const h = total(a) / 9;
    const score = model.v * h + model.c;
    const p = sig(score);
    const loss = softplus(y === 1 ? -score : score);
    return {z, a, h, score, p, loss};
  }
  function traceExample(example, before) {
    const {x, y} = example;
    const f = forward(x, y, before);
    const delta = f.p - y;
    const dh = before.v * delta;
    const da = dh / 9;
    const dz = grid(3, (i, j) => f.z[i][j] > 0 ? da : 0);
    const contributions = (u, v) => grid(3, (i, j) => dz[i][j] * x[i+u][j+v]);
    const dk = grid(2, (u, v) => total(contributions(u, v)));
    const gradients = {k:dk, b:total(dz), v:delta * f.h, c:delta};
    const after = {
      k:grid(2, (u, v) => before.k[u][v] - learningRate * dk[u][v]),
      b:before.b - learningRate * gradients.b,
      v:before.v - learningRate * gradients.v,
      c:before.c - learningRate * gradients.c
    };
    return {before, f, delta, dh, da, dz, gradients, contributions, after, applied:false};
  }

  const number = (x, precision=4) => {
    if (Math.abs(x) < 0.5 * 10 ** -precision) return '0';
    return Number(x.toFixed(precision)).toString().replace('-', '−');
  };
  const signedTerm = (x, p=4) => x < 0 ? '(' + number(x,p) + ')' : number(x,p);
  const pct = (p) => (p * 100).toFixed(1) + '%';
  const coord = (i,j) => '('+i+', '+j+')';
  const tag = (kind, inside) => '<'+kind+'>'+inside+'</'+kind+'>';
  const mi = x => tag('mi',x), mn = x => tag('mn',x), mo = x => tag('mo',x);
  const textM = x => tag('mtext',x), group = x => tag('mrow',x);
  const sub = (x,y) => tag('msub',group(x)+group(y));
  const sup = (x,y) => tag('msup',group(x)+group(y));
  const frac = (x,y) => tag('mfrac',group(x)+group(y));
  const par = x => mo('(')+x+mo(')');
  const s = (sym, indices) => sub(mi(sym),textM(indices));
  const D = (name) => frac(mo('∂')+mi('L'),mo('∂')+name);
  const math = (body,label='') => '<math xmlns="http://www.w3.org/1998/Math/MathML"'+(label?' aria-label="'+label+'"':'')+'>'+group(body)+'</math>';
  const equals = mo('='), minus = mo('−'), plus = mo('+'), mult = mo('·');
  const symSum = (ix) => tag('munder',mo('∑')+group(textM(ix)));
  const pieces = (...chunks) => '<div class="cnn-work">'+chunks.map(x=>'<span>'+x+'</span>').join('')+'</div>';
  const term = x => '<span class="term">'+x+'</span>';
  const series = (values) => values.map((value, index) => term((index ? '+ ' : '') + value)).join(' ');
  const mathBlock = (...parts) => '<div class="cnn-math">'+parts.join('')+'</div>';
  const label = x => '<div class="cnn-label">'+x+'</div>';
  const board = (...items) => '<div class="cnn-board">'+items.join('')+'</div>';
  const block = (caption, content) => '<div class="cnn-item">'+label(caption)+content+'</div>';
  const note = x => '<div class="text-small text-muted">'+x+'</div>';
  const details = (name,body) => '<details><summary class="cursor-interaction">'+name+'</summary>'+body+'</details>';
  const htmlSub = (name, indices) => '<var>'+name+'</var><sub>'+indices+'</sub>';
  function matrix(values, caption, opts={}) {
    const digits = opts.digits ?? 3;
    const aria = opts.name || caption;
    const rows = values.map((row, i) => '<tr>'+row.map((value, j) => {
      const shown = number(value, digits);
      const selected = opts.selected && opts.selected[0] === i && opts.selected[1] === j;
      const patch = opts.patch && i >= opts.patch[0] && i < opts.patch[0]+2 && j >= opts.patch[1] && j < opts.patch[1]+2;
      if (opts.pick) {
        return '<td><button type="button" class="btn viz-tile" aria-label="'+aria+' row '+i+' column '+j+', '+shown+'" aria-pressed="'+Boolean(selected)+'" data-pick="'+opts.pick+'" data-row="'+i+'" data-col="'+j+'">'+shown+'</button></td>';
      }
      const tone = opts.ink ? Math.min(32, 4+value*7) : (Math.abs(value)<1e-12 ? 4 : 13);
      const tint = opts.ink || value === 0 ? '--foreground' : (value > 0 ? '--viz-series-2' : '--viz-series-3');
      const style = '--cellbg:color-mix(in srgb,var('+tint+') '+tone+'%,var(--background))';
      return '<td aria-label="row '+i+' column '+j+', '+shown+'"><span class="cnn-cell'+(patch?' cnn-inpatch':'')+(selected?' cnn-picked':'')+'" style="'+style+'">'+shown+'</span></td>';
    }).join('')+'</tr>').join('');
    return block(caption,'<table class="cnn-matrix" aria-label="'+aria+'"><tbody>'+rows+'</tbody></table>');
  }
  function paramRows(tr) {
    return [
      ...kernelCells.map(([i,j])=>[htmlSub('K',i+','+j),tr.before.k[i][j],tr.gradients.k[i][j],tr.after.k[i][j]]),
      ['<var>b</var> · filter bias',tr.before.b,tr.gradients.b,tr.after.b],
      ['<var>v</var> · classifier weight',tr.before.v,tr.gradients.v,tr.after.v],
      ['<var>c</var> · classifier bias',tr.before.c,tr.gradients.c,tr.after.c]
    ];
  }
  function comparisonTable(caption,header,rows,cls) {
    const headers = header.map((h,i)=>'<th scope="col"'+(i?' class="text-end"':'')+'>'+h+'</th>').join('');
    const body = rows.map(row=>'<tr><th scope="row">'+row[0]+'</th>'+row.slice(1).map(cell=>'<td class="text-end">'+cell+'</td>').join('')+'</tr>').join('');
    return '<div class="table-responsive"><table class="table table-sm tabular-nums '+cls+'" aria-label="'+caption+'"><thead><tr>'+headers+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  let which='dog', stage=0, updates=0, passNumber=1, model=newModel();
  let trace=traceExample(examples[which],model), replay=null;
  let pixel=[1,0], position=[1,0], weight=[0,0];
  function startPass(exampleName) {
    which=exampleName; stage=0; passNumber=updates+1;
    trace=traceExample(examples[which],model); replay=null;
    pixel=which==='dog'?[1,0]:[2,1];
    position=which==='dog'?[1,0]:[2,1]; weight=[0,0];
  }
  function photo(example) {
    const [r,c]=pixel;
    let lines='';
    for(const k of [32,64,96]) lines+='<path d="M '+k+' 0 V 128 M 0 '+k+' H 128"/>';
    return '<div class="cnn-pic"><img alt="'+example.name+' training drawing" width="128" height="128" src="'+example.image+'"><svg viewBox="0 0 128 128" aria-hidden="true"><g fill="none" stroke="var(--muted-foreground)" stroke-width=".8" opacity=".8">'+lines+'</g><rect x="'+(c*32+1.1)+'" y="'+(r*32+1.1)+'" width="29.8" height="29.8" fill="none" stroke="var(--viz-series-2)" stroke-width="3.6"/></svg></div>';
  }
  function microGrid(values,visible,grayscale=false) {
    const n=values.length, max=Math.max(...values.flat().map(Math.abs),0.000001);
    let boxes='';
    values.forEach((row,i)=>row.forEach((value,j)=>{
      const alpha=visible ? 0.09+.78*Math.abs(value)/max : .1;
      const paint=grayscale || !visible ? '--foreground' : (value<0?'--viz-series-3':'--viz-series-2');
      boxes+='<rect x="'+j*10+'" y="'+i*10+'" width="8.5" height="8.5" fill="var('+paint+')" opacity="'+alpha+'"/>';
    }));
    return '<svg class="cnn-micro" aria-hidden="true" viewBox="0 0 '+(n*10-1.5)+' '+(n*10-1.5)+'">'+boxes+'</svg>';
  }
  function networkRoute(ex,animate) {
    const backwards=stage===5 || stage===6,changing=stage===7;
    const f=stage===8?replay:trace.f;
    const active=[[0],[1],[1,2],[3],[4],[2,3],[1],[1,3],[3,4]][stage];
    const route=backwards?'Backward gradients':changing?'Trainable parameters':'Forward values';
    const names=backwards?['Input','∂L/∂Z','∂L/∂h','∂L/∂s','∂L/∂L']:
      changing?['Input','Filter K, b','Mean','Head v, c','Loss']:['Input','Conv','Pool','P(cat)','Loss'];
    const values=[
      microGrid(ex.x,true,true),
      microGrid(backwards?trace.dz:changing?trace.before.k:f.z,stage>0),
      backwards?number(trace.dh,3):stage>=2?number(f.h,3):'<em>h</em>',
      backwards?number(trace.delta,3):changing?'v, c':stage>=3?pct(f.p):'<em>p</em>',
      backwards?'1':stage>=4?number(f.loss,3):'<em>L</em>'
    ];
    let map='';
    names.forEach((name,i)=>{
      if(i) {
        const symbol=changing || (backwards&&i===1)?'·':backwards?'←':'→';
        const activeLink=backwards?(stage===5?i>=3:i===2):!changing&&stage>=i;
        const carriesSignal=animate&&activeLink&&(backwards || stage===8 || stage===i);
        const delay=stage===8?(i-1)*.14:stage===5?(4-i)*.14:0;
        const flow=carriesSignal?' data-flow="'+(backwards?'back':'forward')+'" style="--flow-delay:'+delay+'s"':'';
        map+='<span class="cnn-link'+(activeLink?' active':'')+'"'+flow+' aria-hidden="true">'+symbol+'</span>';
      }
      map+='<div class="cnn-layer'+(active.includes(i)?' cnn-current':'')+'"><span class="cnn-layer-visual">'+values[i]+'</span><span class="text-small cnn-layer-name">'+name+'</span></div>';
    });
    return '<div class="cnn-route-map" role="img" aria-label="'+route+' across the network. '+(backwards?'Loss to output score to pooled feature to convolution.':changing?'Filter weights and biases, classifier weight and bias.':'Input image to convolution to ReLU and mean to class probability to loss.')+'">'+map+'</div>';
  }
  function inputPage(example) {
    const [i,j]=pixel;
    const brightness=example.mean[i][j];
    return board(block(example.name+' drawing',photo(example)+note('128 × 128 pixels')),matrix(example.x,'Input X',{name:'Input pixel',pick:'pixel',selected:pixel}),block('Training label',math(mi('y')+equals+mn(example.y))+note('Dog = 0 · Cat = 1'))) +
      mathBlock(label('Pixel '+coord(i,j)),pieces('Mean brightness = '+number(brightness,2)+' / 255.',
        'Input darkness = round[4 × (1 − '+number(brightness,2)+' / 255)] = <strong>'+example.x[i][j]+'</strong>.')) +
      details('How the input is made', '<p>For each pixel, brightness = 0.299R + 0.587G + 0.114B. Each cell averages a 32 × 32 block and rounds its darkness to the nearest integer from 0 (white) to 4 (black). Row and column indices start at 0.</p><p class="text-small">Illustrations from <a href="https://github.com/googlefonts/noto-emoji" target="_blank" rel="noreferrer">Google Noto Emoji</a>.</p>');
  }
  function convPage(example) {
    const [i,j]=position, {before,f}=trace;
    const products=kernelCells.map(([u,v]) => signedTerm(before.k[u][v])+' × '+example.x[i+u][j+v]);
    return board(matrix(example.x,'Input X · patch outlined',{ink:true,patch:position}),
      matrix(before.k,'Filter K'),matrix(f.z,'Output Z · pick a cell',{pick:'position',selected:position,name:'Convolution output'})) +
      mathBlock(math(s('Z','i,j')+equals+mi('b')+plus+symSum('u,v')+s('K','u,v')+s('X','i+u,j+v')),
        pieces('<strong>Cell '+coord(i,j)+'</strong>',series([signedTerm(before.b),...products]),'≈ <strong>'+number(f.z[i][j])+'</strong>'),
        note('Filter bias b = '+number(before.b)+' · stride 1 · no padding · filter stays in the same orientation.')) ;
  }
  function reluPage() {
    const {f}=trace,[i,j]=position;
    return board(matrix(f.z,'Filter responses Z',{name:'Filter response',pick:'position',selected:position}),
      matrix(f.a,'After ReLU · A',{selected:position}))+
      mathBlock(math(s('A','i,j')+equals+mi('max')+par(mn(0)+mo(',')+s('Z','i,j'))),
        pieces('At '+coord(i,j)+', max(0, '+number(f.z[i][j])+') = <strong>'+number(f.a[i][j])+'</strong>.'),
        math(mi('h')+equals+frac(symSum('i,j')+s('A','i,j'),mn(9))),
        pieces('Pooled feature h ≈ '+number(total(f.a))+' / 9 ≈ <strong>'+number(f.h)+'</strong>.'))+
      details('See all nine terms',pieces(series(f.a.flat().map(x=>number(x))),'≈ '+number(total(f.a))));
  }
  function probabilities(f,example) {
    return '<div class="cnn-bars">'+[['Dog',1-f.p,'dog'],['Cat',f.p,'cat']].map(([name,p,key])=>
      '<div><div class="cnn-bar-label"><span>'+name+(name===example.name?' · true label':'')+'</span><span class="tabular-nums">'+pct(p)+'</span></div><div class="progress" role="meter" aria-label="'+name+' probability" aria-valuenow="'+(100*p).toFixed(2)+'" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar cnn-'+key+'-mark" style="width:'+(100*p)+'%"></div></div></div>').join('')+'</div>';
  }
  function pred(f) {return f.p===0.5?'Tie':(f.p>0.5?'Cat':'Dog')}
  function predictPage(example) {
    const {f,before}=trace;
    return probabilities(f,example) + '<div class="cnn-outcome">Prediction · '+pred(f)+'</div>' +
      mathBlock(math(mi('s')+equals+mi('v')+mi('h')+plus+mi('c')),
        pieces('Score s ≈ '+number(before.v)+' × '+number(f.h)+' + '+signedTerm(before.c)+' ≈ <strong>'+number(f.score)+'</strong>.'),
        math(mi('p')+equals+mi('P')+par(textM('cat'))+equals+frac(mn(1),mn(1)+plus+sup(mi('e'),minus+mi('s')))),
        pieces('P(cat) ≈ 1 / (1 + exp('+number(-f.score)+')) ≈ '+number(f.p)+'.', 'P(dog) = 1 − p ≈ '+number(1-f.p)+'.'));
  }
  function lossPage(example) {
    const {f}=trace, pTrue=example.y ? f.p : 1-f.p;
    return probabilities(f,example) +
      mathBlock(pieces('<strong>True label · '+example.name+'</strong>','y = '+example.y),
        math(mi('L')+equals+minus+mo('[')+mi('y')+mi('ln')+par(mi('p'))+plus+par(mn(1)+minus+mi('y'))+mi('ln')+par(mn(1)+minus+mi('p'))+mo(']')),
        pieces('With y = '+example.y+', L = '+(example.y?'−ln(p)':'−ln(1 − p)')+' ≈ −ln('+number(pTrue)+') ≈ <strong>'+number(f.loss)+'</strong>.'),
        note('Here p means P(cat). A higher probability for the true class gives a smaller loss.'));
  }
  function headBackPage(example) {
    const {before,f,delta,dh,gradients}=trace;
    return mathBlock(math(mi('δ')+equals+D(mi('s'))+equals+mi('p')+minus+mi('y')),
      pieces('Score gradient δ ≈ '+number(f.p)+' − '+example.y+' ≈ <strong>'+number(delta)+'</strong>.'),
      note(delta>0?'Lowering the cat score would reduce the loss for this dog.':delta<0?'Raising the cat score would reduce the loss for this cat.':'The score gradient is zero.'))+
      comparisonTable('Gradients through the classifier',['Derivative','Chain rule','Value'],[
        ['Classifier weight v','δ × h',number(delta)+' × '+number(f.h)+' ≈ '+number(gradients.v)],
        ['Classifier bias c','δ',number(gradients.c)],
        ['Pooled feature h','δ × v',number(delta)+' × '+signedTerm(before.v)+' ≈ '+number(dh)]
      ],'cnn-comparison')+
      details('Why does the score gradient equal p − y?',mathBlock(
        math(D(mi('p'))+equals+minus+frac(mi('y'),mi('p'))+plus+frac(mn(1)+minus+mi('y'),mn(1)+minus+mi('p'))),
        math(frac(mo('∂')+mi('p'),mo('∂')+mi('s'))+equals+mi('p')+par(mn(1)+minus+mi('p'))),
        math(D(mi('s'))+equals+D(mi('p'))+mult+frac(mo('∂')+mi('p'),mo('∂')+mi('s'))+equals+mi('p')+minus+mi('y'))));
  }
  function filterBackPage(example) {
    const {dz,da,dh,gradients,contributions}=trace, [u,v]=weight;
    const terms=contributions(u,v), ds=dz.flat();
    const inputs=grid(3,(i,j)=>example.x[i+u][j+v]).flat();
    return mathBlock(pieces('Mean pooling sends the same gradient to every A cell.',
        '∂L/∂Aᵢⱼ = '+number(dh)+' / 9 ≈ <strong>'+number(da)+'</strong>.'),
      math(s('D','i,j')+equals+D(s('Z','i,j'))+equals+frac(D(mi('h')),mn(9))+mult+mn(1)+mo('[')+s('Z','i,j')+mo('&gt;')+mn(0)+mo(']')),
      pieces('ReLU passes it where Z > 0. Where Z ≤ 0, it sends 0.')) +
      board(matrix(dz,'Gradient at Z · D',{digits:4}),matrix(gradients.k,'Filter gradient · pick a weight',{name:'Filter gradient',pick:'weight',selected:weight,digits:4}))+
      mathBlock(math(D(s('K','u,v'))+equals+symSum('i,j')+s('D','i,j')+s('X','i+u,j+v')),
        pieces('<strong>Weight '+coord(u,v)+'</strong>', 'Sum of contributions from its nine uses'),
        pieces(series(terms.flat().map(x=>signedTerm(x))), '≈ <strong>'+number(gradients.k[u][v])+'</strong>.'),
        pieces('Filter bias gradient = sum of all D cells ≈ '+number(gradients.b)+'.'))+
      details('See each pixel × gradient',comparisonTable('Spatial gradient contributions',['Position in Z','Input pixel','Gradient D','Product'],terms.flat().map((value,k)=>[coord(Math.floor(k/3),k%3),number(inputs[k]),number(ds[k]),number(value)]),'cnn-comparison'));
  }
  function updatePage() {
    const [u,v]=weight;
    const rows=paramRows(trace);
    return mathBlock(math(sub(mi('θ'),textM('new'))+equals+sub(mi('θ'),textM('old'))+minus+mi('η')+D(mi('θ'))),
      pieces('Learning rate η = 0.1.','<strong>'+htmlSub('K',u+','+v)+'</strong> ≈ '+number(trace.before.k[u][v])+' − 0.1 × '+signedTerm(trace.gradients.k[u][v])+' ≈ <strong>'+number(trace.after.k[u][v])+'</strong>.'))+
      comparisonTable('All seven gradient-descent updates',['Parameter','Old','Gradient',trace.applied?'New':'Proposed'],rows.map(row=>[row[0],...row.slice(1).map(x=>number(x))]),'cnn-params')+
      '<div class="cnn-facts">'+note('Four filter weights, one filter bias, one classifier weight, and one classifier bias. Values are rounded for display.')+'</div>';
  }
  function afterPage(example) {
    const {f,after}=trace, next=replay;
    const pTrue = v => example.y?v.p:1-v.p;
    return comparisonTable('Prediction before and after one update',['Same '+which+' image','Before','After'],[
      ['P(dog)',pct(1-f.p),pct(1-next.p)],
      ['P(cat)',pct(f.p),pct(next.p)],
      ['Predicted class',pred(f),pred(next)],
      ['Cross-entropy loss',number(f.loss),number(next.loss)]
    ],'cnn-comparison')+
      mathBlock(pieces('<strong>New feature</strong>','h′ ≈ '+number(total(next.a))+' / 9 ≈ '+number(next.h)+'.'),
        pieces('<strong>New score</strong>','s′ ≈ '+number(after.v)+' × '+number(next.h)+' + '+signedTerm(after.c)+' ≈ '+number(next.score)+'.'),
        pieces('<strong>New loss</strong>','L′ = −ln P('+which+') ≈ −ln('+number(pTrue(next))+') ≈ '+number(next.loss)+'.'))+
      details('Compare the filter responses before and after',board(matrix(f.z,'Before · Z'),matrix(next.z,'After · Z′')))+
      '<div class="cnn-facts">'+note('Next pass keeps the learned weights. Choose the other drawing to train with the opposite label.')+'</div>';
  }
  const pages=[inputPage,convPage,reluPage,predictPage,lossPage,headBackPage,filterBackPage,updatePage,afterPage];
  stageSelect.innerHTML=steps.map((step,i)=>'<option value="'+i+'">'+(i+1)+' · '+step[0]+'</option>').join('');
  function render(announce=false) {
    const ex=examples[which];
    root.querySelectorAll('[data-example]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.example===which)));
    stageSelect.value=String(stage);
    stageSelect.options[8].disabled=!trace.applied;
    element('route').innerHTML=networkRoute(ex,announce);
    element('phase').textContent=steps[stage][1]+' · '+(stage+1)+' of '+steps.length;
    element('title').textContent=steps[stage][2];
    element('caption').textContent=captions[stage];
    element('pass').textContent='Pass '+passNumber+' · '+updates+(updates===1?' update applied':' updates applied');
    element('figure').innerHTML=pages[stage](ex);
    element('back').disabled=stage===0;
    element('next').textContent=stage===8?'Start next pass →':stage===7?(trace.applied?'See result →':'Apply update →'):'Next →';
    element('reset').hidden=updates===0;
    if(announce) element('live').textContent=ex.name+'. '+(stage+1)+' of 9. '+steps[stage][2]+'.';
  }
  function advance() {
    if (stage===8) { startPass(which); }
    else {
      if(stage===7&&!trace.applied) {
        model=trace.after;
        trace.applied=true;
        updates+=1;
        replay=forward(examples[which].x,examples[which].y,model);
      }
      stage+=1;
    }
    render(true);
  }
  element('next').addEventListener('click',advance);
  element('back').addEventListener('click',()=>{if(stage>0){stage-=1;render(true);}});
  stageSelect.addEventListener('change',()=>{
    const selected=Number(stageSelect.value);
    if(selected!==8 || trace.applied)stage=selected;
    render(true);
  });
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button || !root.contains(button))return;
    if(button.dataset.example && button.dataset.example!==which) {
      startPass(button.dataset.example); render(true);
    } else if(button.dataset.pick) {
      const selected=[Number(button.dataset.row),Number(button.dataset.col)];
      if(button.dataset.pick==='pixel')pixel=selected;
      if(button.dataset.pick==='position')position=selected;
      if(button.dataset.pick==='weight')weight=selected;
      render();
      const replacement=root.querySelector('[data-pick="'+button.dataset.pick+'"][data-row="'+selected[0]+'"][data-col="'+selected[1]+'"]');
      if(replacement)replacement.focus({preventScroll:true});
      element('live').textContent=button.dataset.pick+' '+coord(...selected)+' selected.';
    }
  });
  element('reset').addEventListener('click',()=>{
    model=newModel();updates=0;startPass(which);render(true);element('next').focus({preventScroll:true});
  });
  render();
})();
</script>

</main>
</body>
</html>
